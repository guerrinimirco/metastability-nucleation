[project]
name = "nucleation"
version = "0.1.0"
description = "Quark-droplet nucleation in proto-neutron stars"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mirco Guerrini" }]

# Matches the floor `eos` declares, and for the same measured reasons: scipy
# 1.13's `root(..., method="hybr")` reports success while returning its seed
# unchanged on one of eos's closures, and Python 3.9 reached end of life in
# October 2025. Python 3.11 is the floor numpy 2.3 and scipy 1.17 impose.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.17",
    "eos",
]

# Developed and tested on CPython 3.14.2 with numpy 2.3.5 and scipy 1.17.0.

[build-system]
requires = ["setuptools>=77.0"]   # PEP 639: SPDX `license` string + `license-files`
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nucleation*"]


[project.urls]
Repository = "https://github.com/guerrinimirco/metastability-nucleation"