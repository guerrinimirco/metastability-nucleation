[project]
name = "nucleation"
version = "0.1.0"
description = "Nucleation codes for quark-hadron phase transitions"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "eos",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nucleation*"]
